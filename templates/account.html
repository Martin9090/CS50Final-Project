{% extends "layout.html" %}

{% block title %}
Register
{% endblock %}

{% block main %}
<form action="/account" method="post">
    <div class="mb-3">
        <h4>Update Password</h4>
    </div>
    <br>
    <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="current_password"
            placeholder="Current Password" type="password">
    </div>
    <div class="mb-3">
        <input class="form-control mx-auto w-auto" name="password" placeholder="New Password" type="password">
    </div>
    <div class="mb-3">
        <input class="form-control mx-auto w-auto" name="confirmation" placeholder="Re-type New Password"
            type="password">
    </div>
    <button class="btn btn-primary" type="submit">Change Password</button>
</form>
{% endblock %}
